name: jenkins-webapp-monitoring

x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:?AWS_REGION is required for CloudWatch logging}
      awslogs-group: /jenkins-webapp/lab/monitoring/containers
      awslogs-create-group: "false"

services:
  prometheus:
    <<: *runtime-defaults
    image: prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    user: "65532:65532"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=4GB
      - --web.listen-address=0.0.0.0:9090
    expose:
      - "9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - /opt/monitoring/prometheus-targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    networks:
      - telemetry
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required for CloudWatch logging}
        awslogs-group: /jenkins-webapp/lab/monitoring/containers
        awslogs-stream: prometheus
        awslogs-create-group: "false"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    pids_limit: 128
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50

  grafana:
    <<: *runtime-defaults
    image: grafana/grafana:13.2.0-distroless@sha256:08e6ab6d67a5e21e6540724d3673a572840a43b1ba02d03922d0a21a7dbb38f9
    user: "472"
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_DOMAIN: ${GRAFANA_SERVER_NAME:-grafana.kheven.me}
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: https://${GRAFANA_SERVER_NAME:-grafana.kheven.me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    expose:
      - "3000"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=472
    networks:
      - frontend
      - telemetry
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required for CloudWatch logging}
        awslogs-group: /jenkins-webapp/lab/monitoring/containers
        awslogs-stream: grafana
        awslogs-create-group: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    # The distroless image deliberately contains no shell or HTTP client, so
    # it cannot perform an in-container API probe. The edge proxy's health
    # check reaches Grafana's /api/health endpoint instead; Compose --wait
    # therefore verifies Grafana readiness end to end.
    pids_limit: 256
    # Grafana reached 98% of the former 448 MiB cgroup cap and was OOM-killed
    # during dashboard queries. The t3.small monitoring host has sufficient
    # observed headroom for this bounded 640 MiB allocation.
    mem_limit: 640m
    mem_reservation: 384m
    cpus: 0.75

  node-exporter:
    <<: *runtime-defaults
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    user: "65534:65534"
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*)$
    expose:
      - "9100"
    volumes:
      - /:/host:ro,rslave
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534
    networks:
      - telemetry
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required for CloudWatch logging}
        awslogs-group: /jenkins-webapp/lab/monitoring/containers
        awslogs-stream: node-exporter
        awslogs-create-group: "false"
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 64
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.20

  edge-proxy:
    <<: *runtime-defaults
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24@sha256:93722936b82ec8a1178d48448e619226680d2de3706a1640800e186cd5fa7fd3
    user: "101:1901"
    ports:
      - "${GRAFANA_HTTPS_BIND_ADDRESS:-0.0.0.0}:443:8443"
    volumes:
      - ./nginx/grafana.conf:/etc/nginx/conf.d/default.conf:ro
      # /run resolves through /var/run in Alpine. The writable /var/run tmpfs
      # would mask a /run/tls bind mount, so keep certificate files below the
      # read-only Nginx configuration directory instead.
      - /opt/monitoring/tls:/etc/nginx/tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=1901
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=1901
      - /var/run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=1901
    networks:
      - edge
      - frontend
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required for CloudWatch logging}
        awslogs-group: /jenkins-webapp/lab/monitoring/containers
        awslogs-stream: edge-proxy
        awslogs-create-group: "false"
    depends_on:
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    pids_limit: 64
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.20

networks:
  # Only the Nginx edge proxy joins this bridge. It must not be Docker-internal
  # or Docker's published TCP 443 mapping is unreachable from the host.
  edge:
  frontend:
    internal: true
  telemetry:
    # Prometheus needs egress to the application VPC over the peering route.
    # No telemetry service publishes a host port, so this bridge does not make
    # Prometheus or Node Exporter publicly reachable.

volumes:
  prometheus_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: /opt/monitoring/secrets/grafana-admin-password
