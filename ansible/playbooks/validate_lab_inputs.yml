---
- name: Validate rebuild credentials locally before creating resources
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Check the same private input rules as the security playbook
      ansible.builtin.import_tasks: ../tasks/ci-validate-private-inputs.yml

    - name: Require the foundation's Jenkins password length
      ansible.builtin.assert:
        that:
          - ci_jenkins_admin_password | length >= 16
      no_log: true
