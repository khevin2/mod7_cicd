---
- name: Require the intended pipeline source to be committed and published
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ci_repo_root: '{{ playbook_dir }}/../..'
  tasks:
    - name: Require boolean publication and deployment choices
      ansible.builtin.assert:
        that:
          - ci_publish_approved | default(false) is boolean
          - ci_release_approved | default(false) is boolean
          - ci_rollback_demo_approved | default(false) is boolean
          - not (ci_rollback_demo_approved | default(false)) or (ci_release_approved | default(false))

    - name: Require committed pipeline and application inputs
      ansible.builtin.command:
        argv: [git, diff, --exit-code, --quiet, HEAD, --, Jenkinsfile, scripts, src, test, package.json, package-lock.json, Dockerfile, sonar-project.properties]
        chdir: '{{ ci_repo_root }}'
      changed_when: false

    - name: Read the local source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ ci_repo_root }}'
      register: ci_local_commit
      changed_when: false

    - name: Read the published working branch commit
      ansible.builtin.command:
        argv: [git, ls-remote, origin, refs/heads/feature/secure-ecs-ec2]
        chdir: '{{ ci_repo_root }}'
      register: ci_published_commit
      changed_when: false

    - name: Require the published branch to match the local commit
      ansible.builtin.assert:
        that:
          - ci_published_commit.stdout.split() | length == 2
          - ci_published_commit.stdout.split()[0] == ci_local_commit.stdout
        fail_msg: Commit and push the intended source to feature/secure-ecs-ec2 before running Jenkins.

- name: Enable the managed scan job
  ansible.builtin.import_playbook: configure_ci_job.yml
  vars:
    ci_pipeline_enabled: true

- name: Execute and wait for the explicitly authorized Jenkins build
  tags: [ci_build]
  hosts: ci_demo
  become: true
  gather_facts: false
  vars_files:
    - ../vars/ci-versions.yml
  module_defaults:
    ansible.builtin.uri:
      user: '{{ ci_jenkins_admin_id }}'
      password: '{{ ci_jenkins_admin_password }}'
      force_basic_auth: true
      timeout: 15
  tasks:
    - name: Restore the orchestrator's exact queue identifier
      when: ci_resume_queue_id is defined
      ansible.builtin.set_fact:
        ci_queue_id: '{{ ci_resume_queue_id }}'

    - name: Obtain a CSRF crumb and session cookie
      when: not (ci_resume_validation | default(false) | bool) and ci_resume_queue_id is not defined
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/crumbIssuer/api/json
      register: ci_crumb
      no_log: true

    - name: Queue a build with explicit publication and deployment choices
      when: not (ci_resume_validation | default(false) | bool) and ci_resume_queue_id is not defined
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/job/mod9-secure-ecs/buildWithParameters
        method: POST
        headers: '{{ {ci_crumb.json.crumbRequestField: ci_crumb.json.crumb, "Cookie": ci_crumb.cookies_string} }}'
        body_format: form-urlencoded
        body:
          RELEASE_APPROVED: "{{ 'true' if ci_release_approved | default(false) else 'false' }}"
          PUBLISH_APPROVED: "{{ 'true' if ci_publish_approved | default(false) else 'false' }}"
          ROLLBACK_DEMO_APPROVED: "{{ 'true' if ci_rollback_demo_approved | default(false) else 'false' }}"
          EXPECTED_SOURCE_COMMIT: '{{ ci_expected_source_commit | default("") }}'
        status_code: 201
        follow_redirects: none
      register: ci_build_queue
      no_log: true

    - name: Extract the queued build identifier
      when: not (ci_resume_validation | default(false) | bool) and ci_resume_queue_id is not defined
      ansible.builtin.set_fact:
        ci_queue_id: '{{ ci_build_queue.location | regex_findall("/queue/item/([0-9]+)(?:/|$)") | first }}'
      no_log: true

    - name: Persist the exact queue identifier for the lab orchestrator
      when: ci_run_record_path is defined and not (ci_resume_validation | default(false) | bool)
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: '{{ {"queue_id": ci_queue_id, "source_commit": hostvars["localhost"].ci_local_commit.stdout} | to_nice_json }}'
        dest: '{{ ci_run_record_path }}'
        mode: '0600'

    - name: Wait for the queued build to start
      when: not (ci_resume_validation | default(false) | bool)
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8080/queue/item/{{ ci_queue_id }}/api/json'
      register: ci_queue_status
      until: ci_queue_status.json.executable is defined or ci_queue_status.json.cancelled | default(false)
      retries: 120
      delay: 5
      no_log: true

    - name: Require a started build
      when: not (ci_resume_validation | default(false) | bool)
      ansible.builtin.assert:
        that: ci_queue_status.json.executable is defined
        fail_msg: The queued Jenkins build was cancelled.

    - name: Record the build number
      when: not (ci_resume_validation | default(false) | bool)
      ansible.builtin.set_fact:
        ci_validation_build: '{{ ci_queue_status.json.executable.number }}'

    - name: Read the existing latest build without queuing another
      when: ci_resume_validation | default(false) | bool
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_resume_build_number | default("lastBuild") }}/api/json?tree=number,actions[parameters[name,value]]'
      register: ci_existing_build
      no_log: true

    - name: Require the existing build to match the declared deployment choice
      when: ci_resume_validation | default(false) | bool
      ansible.builtin.assert:
        that:
          - >-
            ci_expected_source_commit is not defined or
            ci_existing_build.json.actions | selectattr('parameters', 'defined') |
            map(attribute='parameters') | flatten |
            selectattr('name', 'equalto', 'EXPECTED_SOURCE_COMMIT') |
            map(attribute='value') | list == [ci_expected_source_commit]
          - >-
            ci_existing_build.json.actions | selectattr('parameters', 'defined') |
            map(attribute='parameters') | flatten |
            selectattr('name', 'equalto', 'PUBLISH_APPROVED') |
            map(attribute='value') | list == [ci_publish_approved | default(false)]
          - >-
            ci_existing_build.json.actions | selectattr('parameters', 'defined') |
            map(attribute='parameters') | flatten |
            selectattr('name', 'equalto', 'RELEASE_APPROVED') |
            map(attribute='value') | list == [ci_release_approved | default(false)]
        fail_msg: The latest build does not match the declared deployment choice.
      no_log: true

    - name: Resume monitoring the existing build number
      when: ci_resume_validation | default(false) | bool
      ansible.builtin.set_fact:
        ci_validation_build: '{{ ci_existing_build.json.number }}'

    - name: Show the build console address
      ansible.builtin.debug:
        msg: 'Build {{ ci_validation_build }}; deployment approved={{ ci_release_approved | default(false) }}. Console via SSH tunnel: http://localhost:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/console'

    - name: Persist the exact build number for the lab orchestrator
      when: ci_run_record_path is defined
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: '{{ {"build_number": ci_validation_build | int, "source_commit": hostvars["localhost"].ci_local_commit.stdout} | to_nice_json }}'
        dest: '{{ ci_run_record_path }}'
        mode: '0600'

    - name: Wait for build completion
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/api/json?tree=building,result'
      register: ci_validation_result
      until: ci_validation_result.json.building is defined and not ci_validation_result.json.building
      retries: 780
      delay: 5
      no_log: true

    - name: Report the build result
      ansible.builtin.debug:
        msg: 'Build {{ ci_validation_build }}: {{ ci_validation_result.json.result }}. Console: http://localhost:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/console'

    - name: Require a successful build
      when: not (ci_rollback_demo_approved | default(false) | bool)
      ansible.builtin.assert:
        that: ci_validation_result.json.result == 'SUCCESS'
        fail_msg: 'Build failed or was aborted. Inspect its console and artifacts. Deployment approved={{ ci_release_approved | default(false) }}; publication approved={{ (ci_publish_approved | default(false)) or (ci_release_approved | default(false)) }}.'

    - name: Export the successful build identity and digest to the lab orchestrator
      when: ci_run_record_path is defined
      block:
        - name: Read the build's checked-out source commit
          ansible.builtin.uri:
            url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/artifact/build-metadata/git-commit.txt'
            return_content: true
          register: ci_run_commit
          no_log: true

        - name: Read the published image digest
          ansible.builtin.uri:
            url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/artifact/build-metadata/image-digest.txt'
            return_content: true
          register: ci_run_digest
          no_log: true

        - name: Require the intended commit and an image from the lab repository
          ansible.builtin.assert:
            that:
              - ci_run_commit.content | trim == hostvars['localhost'].ci_local_commit.stdout
              - (ci_run_digest.content | trim) is match('^447558491229[.]dkr[.]ecr[.]eu-north-1[.]amazonaws[.]com/mod9-ecs@sha256:[0-9a-f]{64}$')

        - name: Read the requested ECS revision for a release
          when: ci_release_approved | default(false) | bool
          ansible.builtin.uri:
            url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/artifact/build-metadata/task-definition-arn.txt'
            return_content: true
          register: ci_run_revision
          no_log: true

        - name: Save the successful result without credentials
          delegate_to: localhost
          become: false
          ansible.builtin.copy:
            content: '{{ {"build_number": ci_validation_build | int, "source_commit": ci_run_commit.content | trim, "image_digest": ci_run_digest.content | trim, "task_definition_arn": ci_run_revision.content | default("") | trim, "result": ci_validation_result.json.result} | to_nice_json }}'
            dest: '{{ ci_run_record_path }}'
            mode: '0600'

    - name: Read rollback proof from the intentionally failed build
      when: ci_rollback_demo_approved | default(false) | bool
      ansible.builtin.uri:
        url: 'http://127.0.0.1:8080/job/mod9-secure-ecs/{{ ci_validation_build }}/artifact/build-metadata/rollback-demo-result.json'
        return_content: true
      register: ci_rollback_proof
      no_log: true

    - name: Require failed Jenkins result and verified automatic recovery
      when: ci_rollback_demo_approved | default(false) | bool
      ansible.builtin.assert:
        that:
          - ci_validation_result.json.result == 'FAILURE'
          - (ci_rollback_proof.content | from_json).automaticRollbackVerified
          - (ci_rollback_proof.content | from_json).imageIdentityVerified
          - (ci_rollback_proof.content | from_json).targetHealthVerified
          - (ci_rollback_proof.content | from_json).applicationHealthVerified
        success_msg: 'Expected Jenkins FAILURE verified; ECS automatically restored the baseline revision, image and health.'
